<html lang="en">
    <head>
        <title>####################</title>
        <link rel="stylesheet" href="stylestart.css">
        <script>
          const bchar = "\u2800";
          const tabwidth = 20;
          const speed = 50;
          let position = 0;
          let direction = 1;
          
          setInterval(() => {
            document.title = bchar.repeat(position) + "|";
            position += direction;
            if (position === tabwidth || position === 0) {
              direction *= -1;
            }
          }, speed);
        </script>
    </head>
